<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Rameez Pallikkalakam — portfolio rebuild in progress.">
  <title>Rameez Pallikkalakam — Portfolio</title>
  <style>
    :root { color-scheme: light; --ink:#151515; --paper:#f3f0e8; --line:rgba(21,21,21,.18); }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body { min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font-family:Arial,Helvetica,sans-serif; }
    main { width:min(1120px,calc(100% - 40px)); min-height:calc(100vh - 40px); padding:32px; border:1px solid var(--line); display:flex; flex-direction:column; justify-content:space-between; }
    header,footer { display:flex; align-items:center; justify-content:space-between; gap:20px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    .status { display:flex; align-items:center; gap:10px; }
    .dot { width:8px; height:8px; border-radius:50%; background:#32a852; box-shadow:0 0 0 5px rgba(50,168,82,.12); }
    section { max-width:820px; padding:80px 0; }
    .eyebrow { margin:0 0 24px; font-size:13px; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(56px,10vw,142px); line-height:.82; letter-spacing:-.065em; font-weight:700; }
    h1 span { display:block; margin-left:.48em; font-weight:400; }
    .intro { max-width:560px; margin:40px 0 0 auto; font-size:clamp(18px,2.2vw,28px); line-height:1.35; }
    nav { display:flex; flex-wrap:wrap; gap:12px; }
    a { color:inherit; text-decoration:none; }
    nav a { border-bottom:1px solid var(--ink); padding:8px 0; font-size:13px; letter-spacing:.08em; text-transform:uppercase; }
    nav a:hover,nav a:focus-visible { opacity:.55; }
    @media (max-width:640px) {
      main { min-height:calc(100vh - 24px); width:calc(100% - 24px); padding:22px; }
      header { align-items:flex-start; }
      section { padding:56px 0; }
      h1 span { margin-left:0; }
      .intro { margin-left:0; }
      footer { align-items:flex-end; flex-direction:column; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <strong>Rameez P.</strong>
      <div class="status"><span class="dot" aria-hidden="true"></span>Fresh start</div>
    </header>
    <section>
      <p class="eyebrow">Portfolio — Dubai, UAE</p>
      <h1>Rameez <span>Pallikkalakam</span></h1>
      <p class="intro">The old portfolio has been cleared. A new, focused body of work starts here.</p>
    </section>
    <footer>
      <span>New portfolio in progress</span>
      <nav aria-label="Contact links">
        <a href="mailto:rameezp007@gmail.com">Email</a>
        <a href="https://github.com/rameezp007-ctrl">GitHub</a>
      </nav>
    </footer>
  </main>
</body>
</html>
